<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audi Heritage | 125 Ans d'Histoire</title>
    <style>
        :root {
            --audi-silver: #a0a0a0;
            --audi-red: #f1052d;
            --bg-black: #050505;
            --paper: #e5e5e5;
        }
        body { font-family: 'Times New Roman', serif; background: var(--bg-black); color: var(--paper); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        #quiz-container { width: 95%; max-width: 850px; background: #111; padding: 40px; border: 1px solid #333; position: relative; box-shadow: 0 0 40px rgba(255,255,255,0.05); }
        #timer { font-size: 2.2rem; color: var(--audi-red); text-align: center; margin-bottom: 20px; font-weight: bold; letter-spacing: 2px; }
        .progress-bar { height: 2px; background: #222; width: 100%; margin-bottom: 30px; }
        .progress-fill { height: 100%; background: var(--audi-red); width: 0%; transition: 0.4s; }
        .question { font-size: 1.6rem; margin-bottom: 30px; text-align: center; line-height: 1.4; font-style: italic; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        button { padding: 18px; border: 1px solid #444; background: transparent; color: var(--paper); cursor: pointer; transition: 0.3s; font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; }
        button:hover:not(:disabled) { background: var(--paper); color: black; border-color: var(--paper); }
        .correct { background: #28a745 !important; border-color: #28a745; color: white; }
        .wrong { background: #dc3545 !important; border-color: #dc3545; color: white; }
        #insight-box { margin-top: 30px; padding: 25px; background: #1a1a1a; border-left: 5px solid var(--audi-red); display: none; }
        #insight-text { font-size: 1.1rem; line-height: 1.6; color: var(--audi-silver); }
        #next-btn { margin-top: 20px; background: var(--audi-red); color: white; border: none; padding: 12px 35px; cursor: pointer; float: right; font-weight: bold; }
        #score-screen { text-align: center; display: none; }
        @media (max-width: 600px) { .options { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div id="quiz-container">
    <div id="game-view">
        <div id="timer">30</div>
        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        <div id="question-text" class="question">Ouverture des archives d'Ingolstadt...</div>
        <div id="options-container" class="options"></div>
        <div id="insight-box">
            <h4 style="margin:0 0 10px 0; color:var(--audi-red); text-transform: uppercase; font-size: 0.8rem;">Note Historique</h4>
            <p id="insight-text"></p>
            <button id="next-btn" onclick="loadNextQuestion()">Suivant →</button>
        </div>
    </div>

    <div id="score-screen">
        <h1 style="font-size: 2.5rem; letter-spacing: 3px;">ANALYSE TERMINÉE</h1>
        <p style="color: var(--audi-silver);">Votre niveau d'expertise historique :</p>
        <p id="final-score" style="font-size: 5rem; margin: 20px 0; font-weight: bold; color: var(--audi-red);"></p>
        <button onclick="location.reload()" style="background: white; color: black; border:none; padding: 15px 40px; font-weight: bold; cursor: pointer;">RECOMMENCER</button>
    </div>
</div>

<script>
const quizData = [
    { q: "En quelle année August Horch a-t-il fondé sa première société 'Horch & Cie' ?", o: ["1899", "1904", "1909", "1932"], a: 0, i: "August Horch a fondé son entreprise à Cologne avant de s'installer en Saxe." },
    { q: "Que signifie 'Audi' en latin ?", o: ["Quatre", "Écoute !", "Cercle", "Rapide"], a: 1, i: "C'est la traduction latine de 'Horch' (écoute en allemand). Ce nom fut suggéré par le fils d'un ami d'August Horch." },
    { q: "En 1932, quatre marques fusionnent pour former Auto Union. Audi, Horch, Wanderer et...", o: ["BMW", "Opel", "DKW", "NSU"], a: 2, i: "DKW était le spécialiste des moteurs deux-temps et des petites voitures à l'époque." },
    { q: "Quel ingénieur de génie a conçu les Flèches d'Argent d'Auto Union dans les années 30 ?", o: ["Ferdinand Porsche", "Enzo Ferrari", "Rudolf Diesel", "Wilhelm Maybach"], a: 0, i: "Ferdinand Porsche a conçu les voitures de course à moteur central arrière pour Auto Union." },
    { q: "Où se trouve le siège social mondial d'Audi aujourd'hui ?", o: ["Berlin", "Munich", "Ingolstadt", "Cologne"], a: 2, i: "Ingolstadt est le cœur de la marque depuis la refondation après la Seconde Guerre mondiale." },
    { q: "En quelle année le groupe Volkswagen a-t-il racheté Audi ?", o: ["1955", "1964", "1972", "1980"], a: 1, i: "VW a racheté la marque à Daimler-Benz, qui ne voyait plus de futur pour Auto Union." },
    { q: "Quel modèle de 1968 a sauvé l'indépendance technologique d'Audi ?", o: ["Audi 50", "Audi 80", "Audi 100", "Audi Quattro"], a: 2, i: "L'Audi 100 a été développée en secret par Ludwig Kraus, malgré l'opposition initiale de VW." },
    { q: "Qui a dirigé Audi dans les années 80 et a imposé le slogan 'Vorsprung durch Technik' ?", o: ["Ferdinand Piëch", "Martin Winterkorn", "Herbert Diess", "Markus Duesmann"], a: 0, i: "Piëch, petit-fils de Porsche, est l'homme qui a transformé Audi en marque premium mondiale." },
    { q: "Quel système révolutionnaire Audi a-t-elle présenté au Salon de Genève 1980 ?", o: ["Le Diesel TDI", "Le châssis Alu", "La transmission Quattro", "L'ABS"], a: 2, i: "Le système Quattro a changé le monde du rallye et de la performance routière pour toujours." },
    { q: "Quelle pilote est devenue la première femme à gagner en WRC avec l'Audi Quattro ?", o: ["Danica Patrick", "Michèle Mouton", "Jutta Kleinschmidt", "Pat Moss"], a: 1, i: "Michèle Mouton a remporté le rallye de Sanremo en 1981, un exploit historique." },
    { q: "En quelle année est sortie l'Audi A8, la première avec châssis en aluminium (ASF) ?", o: ["1988", "1994", "1998", "2002"], a: 1, i: "L'Audi Space Frame (ASF) a permis de réduire drastiquement le poids des grandes berlines." },
    { q: "Quel modèle dessiné par Freeman Thomas est devenu une icône du design en 1998 ?", o: ["Audi A3", "Audi TT", "Audi R8", "Audi Q7"], a: 1, i: "Le TT est considéré comme l'un des designs les plus influents de la fin du 20ème siècle." },
    { q: "Combien de fois Audi a-t-elle remporté les 24 Heures du Mans ?", o: ["5", "9", "13", "16"], a: 2, i: "Entre 2000 et 2014, Audi a exercé une domination quasi-totale avec ses moteurs TDI et hybrides." },
    { q: "Quelle marque de moto légendaire appartient au groupe Audi depuis 2012 ?", o: ["BMW", "Ducati", "MV Agusta", "Triumph"], a: 1, i: "Audi a acquis Ducati via sa filiale Lamborghini." },
    { q: "Quel est le nom de la première voiture Audi 100% électrique de série ?", o: ["Audi e-tron", "Audi Q4", "Audi GT", "Audi A1 e-tron"], a: 0, i: "L'Audi e-tron (SUV) a été lancée en 2018 pour ouvrir l'ère de l'électromobilité." },
    { q: "Quel pilote détient le record de victoires au Mans avec Audi ?", o: ["Tom Kristensen", "Allan McNish", "Benoît Tréluyer", "Jacky Ickx"], a: 0, i: "Tom Kristensen, surnommé 'Monsieur Le Mans', a gagné 9 fois au total, dont 7 avec Audi." },
    { q: "Dans quelle ville se trouve l'usine qui fabrique les modèles 'e-tron GT' ?", o: ["Ingolstadt", "Neckarsulm", "Bruxelles", "Győr"], a: 1, i: "Ils sont produits sur le site de Böllinger Höfe à Neckarsulm." },
    { q: "Quelle était la particularité de l'Audi A2 lancée en 1999 ?", o: ["Moteur rotatif", "Carrosserie 100% aluminium", "Pas de vitres électriques", "4 roues directrices"], a: 1, i: "Bien qu'en avance sur son temps, ses coûts de production en alu étaient trop élevés pour son segment." },
    { q: "Quel modèle de 1980 a servi de base à l'homologation de la Quattro en Rallye ?", o: ["Audi 80", "Audi Coupé", "Audi 200", "Audi Quattro (Ur-Quattro)"], a: 3, i: "L'Ur-Quattro est devenue le modèle fondateur de l'ADN moderne d'Audi." },
    { q: "En 1937, Auto Union a battu un record de vitesse sur autoroute. À combien ?", o: ["306 km/h", "356 km/h", "406 km/h", "456 km/h"], a: 2, i: "Bernd Rosemeyer a atteint 406 km/h sur une autoroute publique fermée." },
    { q: "Quel ingénieur a dirigé le développement du moteur TDI chez Audi ?", o: ["Ferdinand Piëch", "Ulrich Baretzky", "Richard Bauder", "Hans Mezger"], a: 2, i: "Richard Bauder est considéré comme le père du TDI chez Audi." },
    { q: "Quelle est la couleur officielle d'Audi Sport ?", o: ["Bleu", "Rouge", "Argent", "Noir"], a: 1, i: "Le losange rouge est l'emblème d'Audi Sport depuis des décennies." },
    { q: "Comment s'appelait l'ancêtre d'Audi spécialisé dans les voitures de luxe ?", o: ["Horch", "DKW", "Wanderer", "NSU"], a: 0, i: "Horch était le concurrent direct de Mercedes-Benz dans l'entre-deux-guerres." },
    { q: "En 2006, Audi gagne le Mans avec une technologie inédite en course. Laquelle ?", o: ["Le KERS", "Le moteur Diesel (TDI)", "Le Turbo", "Le GPL"], a: 1, i: "L'Audi R10 TDI a été la première voiture Diesel à gagner les 24 Heures du Mans." },
    { q: "Quel pilote de rallye a fait du 'saut à ski' avec une Audi 100 CS pour une pub ?", o: ["Walter Röhrl", "Harald Demuth", "Stig Blomqvist", "Hannu Mikkola"], a: 1, i: "La publicité de 1986 sur le tremplin de Kaipola est devenue légendaire." },
    { q: "Quel concept car de 1991 préfigurait la supercar R8 ?", o: ["Avus Quattro", "Quattro Spyder", "Rosemeyer", "Le Mans Quattro"], a: 0, i: "L'Avus Quattro avec sa carrosserie en aluminium poli était un hommage aux records de 1937." },
    { q: "Qui est le designer de la première Audi A5, qu'il jugeait être sa plus belle création ?", o: ["Walter de Silva", "Marc Lichte", "Peter Schreyer", "Ian Callum"], a: 0, i: "Walter de Silva a défini le nouveau visage d'Audi dans les années 2000." },
    { q: "Quelle voiture Audi a été la première à utiliser des phares LED en 2008 ?", o: ["Audi A4", "Audi R8", "Audi Q7", "Audi A8"], a: 1, i: "L'Audi R8 fut la première voiture au monde équipée de phares intégralement à LED." },
    { q: "Quel est le nom de la division responsable des modèles RS ?", o: ["Audi Racing", "Audi Sport GmbH (ex-Quattro GmbH)", "S-Line Corp", "Vorsprung Division"], a: 1, i: "Anciennement Quattro GmbH, elle a été renommée Audi Sport GmbH en 2016." },
    { q: "Quelle innovation a été introduite sur l'Audi A8 en 2017 (Niveau 3) ?", o: ["Le stationnement automatique", "Le pilote automatique (Traffic Jam Pilot)", "Les vitres blindées", "La direction par câble"], a: 1, i: "Audi fut le premier à proposer un système d'autonomie de niveau 3, bien que bridé par la législation." },
    { q: "Quel type de moteur unique Audi utilise-t-elle encore sur sa RS3 ?", o: ["V6 Turbo", "4 cylindres Boxer", "5 cylindres en ligne", "V8 Biturbo"], a: 2, i: "Le 5 cylindres est une signature sonore et historique d'Audi depuis les années 70." },
    { q: "En quelle année Audi a-t-elle fusionné avec NSU ?", o: ["1959", "1969", "1979", "1989"], a: 1, i: "La fusion a donné naissance à Audi NSU Auto Union AG, basée à Neckarsulm." },
    { q: "Quelle innovation NSU a-t-elle apportée (mais qui fut un échec commercial) ?", o: ["Le moteur rotatif Wankel", "La traction avant", "La boîte auto", "Le turbo"], a: 0, i: "La NSU Ro80 était magnifique mais son moteur rotatif manquait de fiabilité." },
    { q: "Quel modèle Audi a introduit le 'Singleframe' (la grande calandre) en 2004 ?", o: ["Audi A3 Sportback", "Audi A6 (C6)", "Audi A8 W12", "Toutes ces réponses"], a: 3, i: "La calandre Singleframe est devenue l'identité visuelle majeure de la marque." },
    { q: "En 2012, Audi a gagné le Mans avec quel type de propulsion ?", o: ["Diesel Classique", "Hybride Diesel (e-tron quattro)", "Essence Turbo", "Solaire"], a: 1, i: "L'Audi R18 e-tron quattro utilisait un volant d'inertie pour stocker l'énergie." },
    { q: "Quel record Walter Röhrl a-t-il battu en 1987 ?", o: ["Record du Nürburgring", "Record de Pikes Peak", "Vitesse sur glace", "Consommation minimale"], a: 1, i: "Il fut le premier à descendre sous les 11 minutes sur la célèbre montée américaine." },
    { q: "Où Audi fabrique-t-elle la majorité de ses moteurs ?", o: ["Ingolstadt", "Győr (Hongrie)", "Bratislava", "Changchun"], a: 1, i: "L'usine de Győr est l'un des plus grands centres de production de moteurs au monde." },
    { q: "Quel est le nom de la plateforme électrique partagée avec Porsche ?", o: ["MEB", "PPE", "J1", "MQB"], a: 1, i: "La Premium Platform Electric (PPE) équipe les nouveaux Q6 e-tron et A6 e-tron." },
    { q: "En 1921, Audi fut le premier allemand à sortir une voiture avec...", o: ["Des freins à disque", "Le volant à gauche", "Un toit ouvrant", "Un moteur V8"], a: 1, i: "C'était sur l'Audi Type K." },
    { q: "Quelle voiture Audi Tony Stark (Iron Man) conduit-il en 2008 ?", o: ["Audi R8", "Audi S5", "Audi Q7", "Audi A8 L"], a: 0, i: "Ce placement de produit a massivement boosté l'image de la R8 lors de son lancement." },
    { q: "Quel était le slogan original avant 'Vorsprung durch Technik' ?", o: ["Audi, la qualité", "Vivre l'auto", "Chaque chemin est le bon", "Pas de slogan fixe"], a: 3, i: "Le slogan actuel n'est apparu qu'en 1971 pour l'Audi 80." },
    { q: "Quel designer a créé l'Audi A2 et l'Audi Quattro Concept (2010) ?", o: ["Luc Donckerwolke", "Chris Bangle", "Stefan Sielaff", "Peter Schreyer"], a: 3, i: "Peter Schreyer a marqué le design Audi avant de partir chez Kia/Hyundai." },
    { q: "En quelle année Audi a-t-elle annoncé son entrée en Formule 1 ?", o: ["2020", "2021", "2022", "2023"], a: 2, i: "L'annonce a été faite au GP de Belgique 2022." },
    { q: "Quelle victoire historique a eu lieu en 1936 avec Bernd Rosemeyer ?", o: ["Champion d'Europe des pilotes", "Vainqueur du Mans", "Champion IndyCar", "Vainqueur du Dakar"], a: 0, i: "C'était l'équivalent du titre mondial de F1 de l'époque." },
    { q: "Quel matériau Audi a-t-elle utilisé pour ses premières voitures de sport après-guerre ?", o: ["Acier", "Fibre de verre", "Plastique (DKW)", "Aluminium"], a: 2, i: "DKW utilisait des carrosseries en plastique pour pallier la pénurie d'acier." },
    { q: "Le logo Audi représente l'union de marques de quelle région d'Allemagne ?", o: ["Bavière", "Saxe", "Hesse", "Westphalie"], a: 1, i: "Les quatre marques étaient toutes basées en Saxe à l'origine." },
    { q: "Comment s'appelle le musée officiel d'Audi à Ingolstadt ?", o: ["Audi World", "Audi Museum mobile", "The Ring", "Horch Center"], a: 1, i: "Le Museum mobile présente les voitures sur un paternoster (ascenseur circulaire) géant." },
    { q: "Quel modèle RS a été développé avec l'aide de Porsche en 1994 ?", o: ["RS3", "RS4", "RS2 Avant", "RS6"], a: 2, i: "L'Audi RS2 possède de nombreuses pièces Porsche (freins, roues, rétros)." },
    { q: "Quelle est la particularité du moteur de l'Audi R8 actuelle ?", o: ["V8 Turbo", "V10 atmosphérique", "W12", "V6 Hybride"], a: 1, i: "Il partage son architecture avec celui de la Lamborghini Huracán." },
    { q: "En 2024, quel pilote français a remporté le Dakar avec Audi ?", o: ["Stéphane Peterhansel", "Sébastien Loeb", "Carlos Sainz (père)", "Guerlain Chicherit"], a: 2, i: "Carlos Sainz a offert à Audi sa première victoire historique au Dakar avec le RS Q e-tron." }
];

let currentIdx = 0;
let score = 0;
let timer;
let timeLeft = 30;

function startTimer() {
    timeLeft = 30;
    document.getElementById('timer').innerText = timeLeft;
    timer = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').innerText = timeLeft;
        if(timeLeft <= 0) {
            clearInterval(timer);
            revealAnswer(-1);
        }
    }, 1000);
}

function loadQuestion() {
    if(currentIdx >= quizData.length) {
        showFinalScore();
        return;
    }
    const q = quizData[currentIdx];
    document.getElementById('question-text').innerText = `Question ${currentIdx + 1}/50 : ${q.q}`;
    document.getElementById('insight-box').style.display = 'none';
    const container = document.getElementById('options-container');
    container.innerHTML = '';
    
    q.o.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.innerText = opt;
        btn.onclick = () => revealAnswer(index);
        container.appendChild(btn);
    });

    document.getElementById('progress').style.width = `${(currentIdx / quizData.length) * 100}%`;
    startTimer();
}

function revealAnswer(selectedIdx) {
    clearInterval(timer);
    const correctIdx = quizData[currentIdx].a;
    const buttons = document.querySelectorAll('#options-container button');
    
    buttons.forEach((btn, i) => {
        btn.disabled = true;
        if(i === correctIdx) btn.classList.add('correct');
        if(i === selectedIdx && selectedIdx !== correctIdx) btn.classList.add('wrong');
    });

    if(selectedIdx === correctIdx) score++;
    
    document.getElementById('insight-text').innerText = quizData[currentIdx].i;
    document.getElementById('insight-box').style.display = 'block';
}

function loadNextQuestion() {
    currentIdx++;
    loadQuestion();
}

function showFinalScore() {
    document.getElementById('game-view').style.display = 'none';
    document.getElementById('score-screen').style.display = 'block';
    document.getElementById('final-score').innerText = `${score} / 50`;
}

window.onload = loadQuestion;
</script>
</body>
</html>
