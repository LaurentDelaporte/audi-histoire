<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Audi Heritage | Quiz</title>
    <style>
        :root { --audi-red: #f1052d; --bg-black: #050505; --paper: #e5e5e5; }
        body { font-family: sans-serif; background: var(--bg-black); color: var(--paper); display: flex; justify-content: center; padding: 20px; }
        #quiz-container { width: 100%; max-width: 800px; }
        #timer { font-size: 2rem; color: var(--audi-red); text-align: center; margin-bottom: 20px; }
        .options { display: grid; gap: 10px; margin-top: 20px; }
        button { padding: 15px; cursor: pointer; background: #222; color: white; border: 1px solid #444; }
        .correct { background: #28a745 !important; }
        .wrong { background: #dc3545 !important; }
        #insight-box { margin-top: 20px; padding: 15px; background: #1a1a1a; display: none; border-left: 4px solid var(--audi-red); }
    </style>
</head>
<body>

<div id="quiz-container">
    <div id="timer">30</div>
    <div id="question-text" style="font-size: 1.5rem; text-align: center;">Chargement...</div>
    <div id="options-container" class="options"></div>
    <div id="insight-box">
        <p id="insight-text"></p>
        <button id="next-btn" onclick="nextQuestion()">Suivant →</button>
    </div>
</div>

<script>
// Ton tableau de données doit être parfaitement propre
const quizData = [
    { q: "Quel modèle Audi a été le premier à proposer la boîte DSG ?", o: ["Audi A3", "Audi TT", "Audi A4", "Audi R8"], a: 1, i: "C'est l'Audi TT 3.2 Quattro en 2003." },
    { q: "Quelle Audi est surnommée 'La tueuse de supercars' ?", o: ["Audi S3", "Audi RS 3", "Audi RS 6", "Audi R8 V10"], a: 2, i: "La RS 6 est réputée pour ses performances de supercar." }
    // Ajoute ici tes 150 questions en t'assurant que chaque objet est bien fermé par } et séparé par une virgule
];

let currentIdx = 0;
let timer;
let timeLeft = 30;

function startTimer() {
    timeLeft = 30;
    document.getElementById('timer').innerText = timeLeft;
    clearInterval(timer);
    timer = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').innerText = timeLeft;
        if(timeLeft <= 0) { clearInterval(timer); reveal(-1); }
    }, 1000);
}

function loadQ() {
    if(currentIdx >= quizData.length) { alert("Terminé !"); return; }
    const q = quizData[currentIdx];
    document.getElementById('question-text').innerText = q.q;
    const cont = document.getElementById('options-container');
    cont.innerHTML = '';
    q.o.forEach((opt, i) => {
        const b = document.createElement('button');
        b.innerText = opt;
        b.onclick = () => reveal(i);
        cont.appendChild(b);
    });
    document.getElementById('insight-box').style.display = 'none';
    startTimer();
}

function reveal(idx) {
    clearInterval(timer);
    const correct = quizData[currentIdx].a;
    const btns = document.querySelectorAll('.options button');
    btns.forEach((b, i) => {
        b.disabled = true;
        if(i === correct) b.classList.add('correct');
        else if(i === idx) b.classList.add('wrong');
    });
    document.getElementById('insight-text').innerText = quizData[currentIdx].i;
    document.getElementById('insight-box').style.display = 'block';
}

function nextQuestion() {
    currentIdx++;
    loadQ();
}

loadQ();
</script>
</body>
</html>
